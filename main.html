<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap">
        <link rel="icon" href="df_prog.png" type="image/png">
        <link rel="stylesheet" href="style.css">
        <title>Ability Progression creator</title>
    </head>
    <body>
        <h2>Ability Progression Generator</h2>
        <hr>

        <h3>Abilities</h3>
        <div id="abilities"></div>
        <datalist id="abilityNames"></datalist>
        <datalist id="raceNames"></datalist>
        <datalist id="subRaceNames"></datalist>
        <datalist id="factionNames"></datalist>
        <datalist id="fightingStyleNames"></datalist>
        <datalist id="devilFruitNames"></datalist>
        <datalist id="questNames"></datalist>

        <button class="add-btn" onclick="addAbility()">+ Add Ability</button>
        <hr>

        <h3>Awakenings</h3>
        <div id="awakenings"></div>
        <button class="add-btn" onclick="addAwakening()">+ Add Awakening</button>
        <hr>

        <div class="footer">
            <button onclick="createZip()">Create Zip</button>
            <label>Import datapack: <input type="file" accept=".zip" onchange="importZip(this.files[0])"></label>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
        <script src="script.js"></script>
        <script>loadConfigs();</script>
    </body>
</html>
